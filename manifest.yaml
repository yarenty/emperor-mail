name: mail
type: server
about:
  title: Email (IMAP/SMTP)
  description: Search and read email and attachments (PDF, Word, spreadsheets), save drafts, and send to allowed recipients over IMAP and SMTP.
  icon: /mcpicons/mail.svg
meta:
  category: communication
  tags: [email, imap, smtp, drafts]
endpoint: http://127.0.0.1:8033/mcp
topology: forward-headers
tools:
  - name: list_folders
    description: List folders with special use and message and unread counts.
  - name: search
    description: Search a folder by from, to, subject, text, date range and unread state; newest first, at most 100.
  - name: read_message
    description: Headers, plain-text body and attachment list of one message; leaves it unread unless mark_read is true.
  - name: read_attachment
    description: Text of one text, HTML, PDF, DOCX or spreadsheet (XLSX, XLS, ODS) attachment; metadata only for other types.
  - name: draft
    description: Save a Markdown message (optionally a threaded reply) in the Drafts folder for a person to send.
  - name: send
    description: Send a Markdown message over SMTP and copy it to the Sent folder; only when the server runs with --allow-send and only to allowed recipients.
headers:
  X-Mail-User:
    description: Login name.
    required: true
  X-Mail-Password:
    description: Password or app password. Forwarded to the mail server for one call, never stored.
    secret: true
  X-Mail-Oauth-Token:
    description: OAuth 2.0 access token (XOAUTH2) instead of a password; the client obtains and refreshes it. Never stored.
    secret: true
  X-Mail-From:
    description: From address when the login name is not an address (checked against --from-allow).
  X-Mail-Imap-Host:
    description: IMAP server for a header login; falls back to IMAP_HOST (ignored with --pin-servers).
  X-Mail-Imap-Port:
    description: IMAP port (993 with tls, 143 with starttls).
  X-Mail-Imap-Security:
    description: tls or starttls.
  X-Mail-Smtp-Host:
    description: SMTP server for a header login, needed by send; falls back to SMTP_HOST (ignored with --pin-servers).
  X-Mail-Smtp-Port:
    description: SMTP port (465 with tls, 587 with starttls).
  X-Mail-Smtp-Security:
    description: tls or starttls.
config:
  parameters:
    type: object
    properties:
      imap_host:
        type: string
        ui:
          label: IMAP host (IMAP_HOST)
          hint: Default IMAP server. Callers with their own login may name another unless servers are pinned.
      smtp_host:
        type: string
        ui:
          label: SMTP host (SMTP_HOST)
          hint: Needed only when sending is allowed.
      pin_servers:
        type: boolean
        default: false
        ui:
          label: Pin servers (--pin-servers)
          hint: Always use IMAP_HOST / SMTP_HOST; ignore server headers.
      allow_send:
        type: boolean
        default: false
        ui:
          label: Allow send (--allow-send)
          hint: Off means draft only.
      send_allow:
        type: array
        items:
          type: string
        default: []
        ui:
          label: Allowed recipients (--send-allow)
          hint: Exact addresses or @domain patterns.
      from_allow:
        type: array
        items:
          type: string
        default: []
        ui:
          label: Allowed From addresses (--from-allow)
          hint: Exact addresses or @domain patterns; empty allows any.
      sent_copy:
        type: boolean
        default: true
        ui:
          label: Copy sent mail to Sent (off = --no-sent-copy)
          hint: Turn off for Gmail and Microsoft 365, which file sent mail themselves.
test_tool:
  name: list_folders
  args: {}

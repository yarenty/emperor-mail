name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - "src/**"
      - scripts/docker-greenmail.sh
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - "src/**"
      - scripts/docker-greenmail.sh
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    # Build the image natively on each architecture and run it over stdio against GreenMail.
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - run: docker pull greenmail/standalone:2.1.5
      - run: docker build -t emperor-mail:test .
      - run: docker image inspect emperor-mail:test --format '{{.Architecture}} {{.Size}}'
      - run: scripts/docker-greenmail.sh emperor-mail:test

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel-mac runners (macos-13) are retired; cross-compile on Apple Silicon.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf emperor-mail-${{ github.ref_name }}-${{ matrix.target }}.tar.gz emperor-mail
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path emperor-mail.exe -DestinationPath "emperor-mail-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/${{ matrix.target }}/release/emperor-mail-*.tar.gz
            target/${{ matrix.target }}/release/emperor-mail-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: emperor-mail-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/emperor-mail-*.tar.gz
            target/${{ matrix.target }}/release/emperor-mail-*.zip
          if-no-files-found: error

  publish:
    name: Checksums and release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: emperor-mail-*
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum emperor-mail-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SHA256SUMS
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/emperor-mail-*
            dist/SHA256SUMS

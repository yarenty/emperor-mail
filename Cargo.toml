[package]
name = "emperor-mail"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "MCP server for email: search, read, draft and (guarded) send over IMAP and SMTP"
license = "MIT OR Apache-2.0"
authors = ["yarenty <yarenty@gmail.com>"]
repository = "https://github.com/yarenty/emperor-mail"
homepage = "https://github.com/yarenty/emperor-mail"
readme = "README.md"
keywords = ["mcp", "mcp-server", "email", "imap", "smtp"]
categories = ["command-line-utilities", "email", "network-programming"]

[dependencies]
emperor-mcp = "0.3"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-platform-verifier = "0.7"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring"] }
mail-parser = "0.11"   # 1.0 needs Rust 1.98
lopdf = { version = "0.46", default-features = false }
html2text = "0.17"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
calamine = { version = "0.37", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
base64 = "0.22"
emperor-mcp = { version = "0.3", features = ["testkit"] }
